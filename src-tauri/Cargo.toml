[package]
name = "aequo"
version = "1.0.0"
description = "A macOS RSS/Atom/JSON Feed reader"
authors = ["S0okJu"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aequo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
feed-rs = "2"
quick-xml = { version = "0.41", features = ["encoding"] }
legible = "0.5.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
url = "2"
base64 = "0.22"

[dev-dependencies]
wiremock = "0.6"
tauri = { version = "2", features = ["test"] }

[lints.clippy]
all = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
