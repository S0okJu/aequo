name: Release macOS

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# Serialize retries of the same PR without dropping other queued releases.
concurrency:
  group: release-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      release_branch: ${{ github.event.pull_request.head.ref }}

  publish:
    name: Publish verified DMG
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read release version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 .github/scripts/release-version.py

      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-dmg
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash .github/scripts/publish-release.sh
