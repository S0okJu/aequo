name: Release macOS

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

# Stable publication is serialized across versions; the script also rejects regressions.
concurrency:
  group: release-macos-stable
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      release_branch: ${{ github.event.pull_request.head.ref }}
      signed_release: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Publish verified app and updater
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read release version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 .github/scripts/release-version.py

      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-dmg
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-updater
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: bash .github/scripts/publish-release.sh
